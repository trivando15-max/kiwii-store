<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIWII STORE - Tu Tienda Gamer de Confianza</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        kiwi: {
                            red: '#ff1e27',
                            darkred: '#800000',
                            gold: '#ffb703',
                            blue: '#00d4ff',
                            dark: '#08080a',
                            card: '#101216',
                            border: '#1f2430'
                        }
                    },
                    fontFamily: {
                        orbitron: ['Orbitron', 'sans-serif'],
                        rajdhani: ['Rajdhani', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #08080a; color: #ffffff; font-family: 'Roboto', sans-serif; overflow-x: hidden; }
        .animated-bg { position: relative; }
        .animated-bg::before {
            content: ""; position: fixed; top: 0; left: 0; width: 200%; height: 200%;
            background-image: linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 0), linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 0);
            background-size: 30px 30px; z-index: 0; pointer-events: none;
        }
        
        @keyframes orbMove1 { 0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.4; } 50% { transform: translate(5vw, 5vh) scale(1.2); opacity: 0.7; } }
        @keyframes orbMove2 { 0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.3; } 50% { transform: translate(-8vw, -8vh) scale(0.9); opacity: 0.6; } }
        .animate-orb1 { animation: orbMove1 12s infinite ease-in-out; }
        .animate-orb2 { animation: orbMove2 18s infinite ease-in-out; }

        .glow-red { box-shadow: 0 0 25px rgba(255, 30, 39, 0.4); }
        .text-glow-red { text-shadow: 0 0 12px rgba(255, 30, 39, 0.8); }
        .glow-gold { box-shadow: 0 0 25px rgba(255, 183, 3, 0.4); }
        
        .kiwi-float { animation: kiwiBounce 3s ease-in-out infinite; }
        @keyframes kiwiBounce { 0%, 100% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-10px) rotate(3deg); } }

        .kiwi-float-subtle { animation: kiwiBounceSubtle 4s ease-in-out infinite; }
        @keyframes kiwiBounceSubtle { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-4px); } }
        .text-float-subtle { animation: textPulseSubtle 4s ease-in-out infinite; }
        @keyframes textPulseSubtle { 0%, 100% { transform: translateY(0px); text-shadow: 0 0 5px rgba(255, 30, 39, 0.2); } 50% { transform: translateY(-2px); text-shadow: 0 0 15px rgba(255, 30, 39, 0.7); } }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #3f4758; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #ff1e27; }

        .reveal { opacity: 0; transform: translateY(40px); transition: all 0.8s cubic-bezier(0.5, 0, 0, 1); }
        .reveal.active { opacity: 1; transform: translateY(0); }

        .details-panel { transition: max-height 0.4s ease-out, opacity 0.3s ease-out; max-height: 0; opacity: 0; overflow: hidden; }
        .details-panel.open { max-height: 800px; opacity: 1; border-color: #1f2430; }
        .selected-card { border-color: #ff1e27 !important; background-color: rgba(255, 30, 39, 0.05); }

        @keyframes fadeOutLoader {
            0% { opacity: 1; visibility: visible; }
            99% { opacity: 0; visibility: visible; }
            100% { opacity: 0; visibility: hidden; display: none; z-index: -10; pointer-events: none; }
        }
        #page-loader { animation: fadeOutLoader 0.5s ease forwards; animation-delay: 1.5s; }

        .role-owner { color: #fbcfe8; background-color: rgba(244, 114, 182, 0.15); border: 1px solid #f472b6; text-shadow: 0 0 8px rgba(244,114,182,0.8); }
        .role-ceo { color: #fdba74; background-color: rgba(249, 115, 22, 0.15); border: 1px solid #f97316; text-shadow: 0 0 8px rgba(251,146,60,0.8); }
        .role-mod { color: #c084fc; background-color: rgba(168, 85, 247, 0.15); border: 1px solid #a855f7; text-shadow: 0 0 8px rgba(192,132,252,0.8); }
        .role-client { color: #6ee7b7; background-color: rgba(5, 150, 105, 0.15); border: 1px solid #10b981; }
        .role-user { color: #9ca3af; background-color: transparent; border: 1px solid transparent; }
    </style>
</head>
<body class="animated-bg min-h-screen flex flex-col justify-between relative z-10 overflow-x-hidden">

    <div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-[50vw] h-[50vw] bg-kiwi-red/10 rounded-full blur-[120px] animate-orb1"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[60vw] h-[60vw] bg-[#5c0005]/20 rounded-full blur-[150px] animate-orb2"></div>
    </div>

    <div id="page-loader" class="fixed inset-0 bg-kiwi-dark z-[200] flex flex-col items-center justify-center transition-opacity duration-700">
        <img src="Logo.jpg" alt="Cargando..." class="w-28 h-28 rounded-full border-4 border-kiwi-red shadow-[0_0_25px_#ff1e27] animate-pulse mb-6 object-cover">
        <div class="flex items-center gap-2 mb-2">
            <div class="w-3 h-3 bg-kiwi-red rounded-full animate-bounce"></div>
            <div class="w-3 h-3 bg-kiwi-red rounded-full animate-bounce" style="animation-delay: 0.1s;"></div>
            <div class="w-3 h-3 bg-kiwi-red rounded-full animate-bounce" style="animation-delay: 0.2s;"></div>
        </div>
        <h2 class="font-orbitron font-bold text-white tracking-widest text-sm text-glow-red">CARGANDO TIENDA...</h2>
    </div>

    <div id="welcome-modal" class="fixed inset-0 bg-black/90 backdrop-blur-sm z-[100] flex items-center justify-center p-4 transition-opacity duration-500 hidden opacity-0">
        <div class="bg-kiwi-card border border-kiwi-red w-full max-w-lg rounded-3xl p-8 relative shadow-[0_0_50px_rgba(255,30,39,0.3)] text-center transform scale-95 transition-transform duration-500">
            <button onclick="window.closeWelcomeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-2xl"></i></button>
            <img src="Logo2.jpg" alt="Kiwii Store Logo" class="w-32 h-32 mx-auto mb-4 rounded-full border-4 border-kiwi-red shadow-lg kiwi-float object-cover">
            <h2 class="font-orbitron text-3xl font-black text-white mb-2">¡BIENVENIDO A <span class="text-kiwi-red text-glow-red">KIWII STORE</span>!</h2>
            <p class="text-gray-300 font-rajdhani text-lg mb-6">Tu aventura empieza aquí. Explora nuestro catálogo de Roblox, Free Fire, Streaming y más. Las mejores ofertas te están esperando.</p>
            <button onclick="window.closeWelcomeModal()" class="bg-kiwi-red hover:bg-red-700 text-white font-orbitron font-bold py-3 px-8 rounded-xl transition shadow-lg glow-red text-lg w-full transform hover:scale-105">
                ¡ENTRAR A LA TIENDA! <i class="fa-solid fa-rocket ml-2"></i>
            </button>
        </div>
    </div>

    <!-- HEADER / NAVBAR -->
    <header class="sticky top-0 z-40 bg-kiwi-dark/95 backdrop-blur-md border-b border-kiwi-border">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between relative z-10">
            <div class="flex items-center gap-1.5 sm:gap-3">
                <button id="staff-menu-btn" onclick="window.toggleStaffDrawer()" class="hidden relative text-kiwi-gold hover:text-yellow-400 text-2xl transition mr-1">
                    <i class="fa-solid fa-bars"></i>
                    <span id="staff-notif-dot" class="hidden absolute -top-1 -right-1 flex h-3 w-3">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-3 w-3 bg-red-500"></span>
                    </span>
                </button>

                <div class="flex items-center gap-3 cursor-pointer group" onclick="window.goBackToHome()">
                    <div class="relative w-12 h-12 rounded-full flex items-center justify-center kiwi-float-subtle overflow-hidden bg-kiwi-dark border border-kiwi-border shadow-[0_0_10px_rgba(255,30,39,0.2)] group-hover:border-kiwi-red transition-colors">
                        <img src="Logo.jpg" alt="Kiwi Logo" class="w-full h-full object-cover">
                    </div>
                    <div class="text-float-subtle hidden sm:block">
                        <h1 class="font-orbitron font-black text-2xl tracking-wider text-white flex items-center gap-1">
                            KIWII <span class="text-kiwi-red text-glow-red">STORE</span>
                        </h1>
                        <p class="text-[10px] text-gray-400 font-rajdhani tracking-widest uppercase mt-[-2px]">TU TIENDA GAMER DE CONFIANZA</p>
                    </div>
                </div>
            </div>



            <div class="flex items-center gap-3">
                <!-- BOTON DE MONEDA -->
                <button onclick="window.openCurrencyModal()" class="bg-kiwi-dark border border-kiwi-border text-white text-sm rounded-xl px-4 py-2 mr-2 font-rajdhani font-bold flex items-center gap-2 hover:border-kiwi-red transition">
                    <span id="currency-flag" class="text-lg">🇦🇷</span>
                    <span id="currency-code">ARS</span>
                    <i class="fa-solid fa-chevron-down text-xs opacity-60"></i>
                </button>

                <!-- CONTADOR ONLINE -->
                <div class="flex items-center gap-2 bg-kiwi-dark border border-kiwi-border px-3 py-1.5 rounded-xl text-kiwi-gold text-xs font-orbitron font-bold shadow-lg mr-2 hidden sm:flex">
                    <span class="relative flex h-2.5 w-2.5 mr-1">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-green-500"></span>
                    </span>
                    ONLINE: <span id="online-counter" class="text-white ml-1 text-sm">1</span>
                </div>
                
                <a href="
